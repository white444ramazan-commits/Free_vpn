name: Free VPN — standalone APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build single-app VPN APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Free VPN and pinned VPN engine source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Rebrand standalone app as Free VPN
        working-directory: standalone-vpn
        shell: bash
        run: |
          set -euo pipefail
          grep -rl 'com.payaq.opengatevpn' app/src | xargs -r sed -i 's/com.payaq.opengatevpn/com.freevpn.client/g'
          sed -i 's/namespace = "com.payaq.opengatevpn"/namespace = "com.freevpn.client"/' app/build.gradle.kts
          sed -i 's/applicationId = "com.payaq.opengatevpn"/applicationId = "com.freevpn.client"/' app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionName = "1.2.0"/versionName = "3.1.0"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">OpenGate VPN</string>#<string name="app_name">Free VPN</string>#' app/src/main/res/values/strings.xml
          sed -i 's/text = "OpenGate"/text = "Free VPN"/' app/src/main/java/com/payaq/opengatevpn/ui/main/MainScreen.kt
          sed -i 's/contentDescription = "OpenGate VPN Logo"/contentDescription = "Free VPN logo"/' app/src/main/java/com/payaq/opengatevpn/ui/main/MainScreen.kt
          sed -i 's/OpenGate could not/Free VPN could not/g' app/src/main/java/com/payaq/opengatevpn/ui/main/VpnViewModel.kt
          sed -i 's/OpenGate needs/Free VPN needs/g' app/src/main/java/com/payaq/opengatevpn/ui/main/VpnViewModel.kt
          sed -i 's/opengate@terminal/freevpn@terminal/g' app/src/main/java/com/payaq/opengatevpn/ui/main/LogsTab.kt
          sed -i 's/opengate:~#/freevpn:~#/g' app/src/main/java/com/payaq/opengatevpn/ui/main/LogsTab.kt

      - name: Apply resilient VPN Gate directory loader
        working-directory: standalone-vpn
        shell: bash
        run: |
          set -euo pipefail
          cp ../.github/patches/VpnGateApi.kt app/src/main/java/com/payaq/opengatevpn/data/remote/VpnGateApi.kt

      - name: Apply country-first server browser
        working-directory: standalone-vpn
        shell: bash
        run: |
          set -euo pipefail
          cp ../.github/patches/ServersTab.kt app/src/main/java/com/payaq/opengatevpn/ui/main/ServersTab.kt
          sed -i 's/server.ip.contains(query, ignoreCase = true)/server.ip.contains(query, ignoreCase = true) || server.hostName.contains(query, ignoreCase = true)/' app/src/main/java/com/payaq/opengatevpn/ui/main/VpnViewModel.kt

      - name: Build standalone APK with the OpenVPN engine embedded
        working-directory: standalone-vpn
        run: chmod +x ./gradlew && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: free-vpn-standalone-apk
          path: standalone-vpn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
